<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUEREQUEQUE - Portal administrativo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts/security.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card">
        <div class="auth-header">
          <p class="eyebrow">Portal administrativo</p>
          <h1>HUEREQUEQUE</h1>
          <p class="auth-subtitle">Acceso seguro para personal autorizado.</p>
        </div>

        <form id="loginForm" class="login-form" autocomplete="off">
          <div class="form-group">
            <label for="email">Email o usuario</label>
            <input id="email" name="email" type="email" placeholder="usuario@unlam.edu.ar" required />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" name="remember" />
              Recordarme en este dispositivo
            </label>
            <a href="#" class="link-secondary">Olvidé mi contraseña</a>
          </div>

          <button type="submit" class="btn-primary">LOG IN</button>
        </form>

        <footer class="auth-footer">
          <p>Acceso seguro para personal autorizado solamente.</p>
          <div class="footer-links">
            <a href="#">Política de seguridad</a>
            <a href="#">Mesa de ayuda</a>
          </div>
        </footer>
      </section>
    </main>
  </body>
</html>
